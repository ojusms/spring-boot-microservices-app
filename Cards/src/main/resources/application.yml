spring:
  application:
    name: Cards
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9000

build:
  version: "1.0"

cards:
  message: "Welcome to Cards service of DemoBank!"
  contactInfo:
    name: "Jane Doe"
    email: "jane@demobank.com"
  onCallSupport:
    - (555) 555-4321
    - (555) 512-8765
