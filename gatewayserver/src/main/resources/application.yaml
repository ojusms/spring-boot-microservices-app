spring:
  application:
    name: gatewayserver
  config:
    import: optional:configserver:http://localhost:8071/
  cloud:                  # enabling GatewayServer to create routes based on services registered in a
    gateway:              # DiscoveryClient compatible service registry implementation (Netflix Eureka here)
      discovery:
        locator:
          enabled: true

info:
  app:
    name: gatewayserver
    description: Gateway server of Demo Bank application
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:                  # enable actuator endpoint to monitor and interact with Spring Cloud Gateway project
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

# maintaining EurekaServer related properties in the ConfigServer